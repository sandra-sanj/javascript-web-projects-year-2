<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurants</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <nav>
      <a href="./index.html">Restaurants</a>
      <a href="./user.html" id="profile-nav-link">Profile</a>
      <a href="./user-login.html" id="login-nav-link">Log In</a>
      <a href="./index.html" id="logout-nav-link">Log Out</a>
    </nav>

    <main>
      <h1>Restaurants</h1>
      <!-- location and map -->
      <div id="map"></div>
      <div id="location"></div>
      <!-- filters -->
      <div id="filters-container">
        <p id="filter-options">Select Filters</p>
        <div class="filter-content collapsible-content">
          <div class="filters">
            <div>
              <p>City</p>
              <div id="city-filter"></div>
            </div>
            <div>
              <p>Company</p>
              <div id="company-filter"></div>
            </div>
          </div>
        </div>
      </div>
      <table id="restaurants">
        <tr id="table-headers">
          <th id="favorite-table-header">Favorite</th>
          <th>Name</th>
          <th>Address</th>
          <th>Distance</th>
        </tr>
        <!-- add restaurants here -->
      </table>
      <!-- modal -->
      <dialog id="modal">
        <!-- add restaurant info here when restaurant is clicked -->
        <ol class="modal-menu-tabs">
          <li id="daily-menu">Daily Menu</li>
          <li id="weekly-menu">Weekly Menu</li>
          <li id="contact-info">Contact Info</li>
          <li id="close-modal">X</li>
        </ol>
      </dialog>
    </main>

    <footer>
      <div>
        <p>© Restaurant Website</p>
      </div>
    </footer>
  </body>
</html>
