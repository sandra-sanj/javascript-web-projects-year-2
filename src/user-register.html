<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register User</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <script type="module" src="user.js" defer></script>
  </head>
  <body>
    <nav>
      <a href="./site.html">Restaurants</a>
      <a href="./user.html" id="profile-nav-link">Profile</a>
      <a href="./user-login.html" id="login-nav-link">Log In</a>
      <a href="./site.html" id="logout-nav-link">Log Out</a>
    </nav>

    <main>
      <h1>Register</h1>
      <form id="register">
        <label for="username">Username:</label><br />
        <input type="text" id="username" name="username" /><br />
        <label for="password">Password:</label><br />
        <input type="password" id="password" name="password" /><br />
        <label for="password2">Password again:</label><br />
        <input type="password" id="password2" name="password2" /><br />
        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" /><br />
        <input type="submit" value="Register" />
      </form>
    </main>

    <footer>
      <div>
        <p>© Restaurant Website</p>
      </div>
    </footer>
  </body>
</html>
