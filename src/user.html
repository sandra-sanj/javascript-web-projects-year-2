<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <script type="module" src="user.js"></script>
  </head>
  <body>
    <nav>
      <a href="./index.html">Restaurants</a>
      <a href="./user.html" id="profile-nav-link">Profile</a>
      <a href="./user-login.html" id="login-nav-link">Log In</a>
      <a href="./index.html" id="logout-nav-link">Log Out</a>
    </nav>

    <main>
      <h1>User Profile</h1>
      <div id="user-container">
        <div>
          <p>Username:</p>
          <p id="user-profile-username"></p>
          <br />
          <p>Email:</p>
          <p id="user-profile-email"></p>
          <br />

          <p>Favorite restaurant:</p>
          <div>
            <p id="user-favorite-restaurant">No favorite restaurant</p>
            <button id="open-favorite-restaurant-modal-btn" class="btn">
              View Information
            </button>
          </div>
          <br />
        </div>

        <img
          src="https://placehold.co/150x150"
          alt="profile picture"
          id="user-profile-picture"
        /><br />
      </div>
      <a href="./user-update-info.html" class="btn">Change Information</a>

      <dialog id="modal">
        <ol class="modal-menu-tabs">
          <li id="daily-menu">Daily Menu</li>
          <li id="weekly-menu">Weekly Menu</li>
          <li id="contact-info">Contact Info</li>
          <li id="close-modal">X</li>
        </ol>
      </dialog>
    </main>

    <footer>
      <div>
        <p>© Restaurant Website</p>
      </div>
    </footer>
  </body>
</html>
